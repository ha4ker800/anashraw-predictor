name: WinGo Collector Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Worker Collector
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://anashraw-predictor.anashrawdixit191.workers.dev/collect)
          echo "Response code: $response"
          if [ "$response" = "200" ]; then
            echo "✅ Collector triggered successfully"
          else
            echo "❌ Collector failed with code $response"
            exit 1
          fi

